[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moretea-robot-mcp"
version = "0.1.0"
description = "Robot-side MCP services for MoreTea"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0,<2",
    "numpy>=1.26,<3",
    "Pillow>=10.0,<12",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
