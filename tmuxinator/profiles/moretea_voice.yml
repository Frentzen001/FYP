name: moretea_voice
root: /home/frentzen/FYP
startup_window: tunnel
windows:
  - precheck:
      panes:
        - >-
          bash -lc 'echo "Remote desktop profile: Speaches (GPU) + MCP tunnel to robot PC.";
          echo "The barebone voice worker now runs on the robot PC (moretea_robot profile).";
          echo;
          echo "Before starting, export ROBOT_USER and ROBOT_HOST:";
          echo "  export ROBOT_USER=<robot-user>";
          echo "  export ROBOT_HOST=<robot-ip>";
          echo;
          echo "Robot stack must be up before this profile starts.";
          echo "First MCP tool to call after launch: health";
          echo;
          exec bash'
  - tunnel:
      panes:
        - >-
          bash -lc 'cd /home/frentzen/FYP/moretea-robot-mcp &&
          ./scripts/openclaw_tunnel.sh'
  - speaches:
      panes:
        - >-
          bash -lc 'cd /home/frentzen/FYP/agent-starter-python &&
          ./scripts/run_speaches.sh;
          exec bash'
  - checks:
      panes:
        - >-
          bash -lc 'echo "Tunnel check (MCP):";
          echo "  /home/frentzen/FYP/moretea-robot-mcp/scripts/probe_tunneled_mcp.sh";
          echo;
          echo "Healthy tunnel means:";
          echo "  1. the tunnel pane is running cleanly";
          echo "  2. the MCP probe succeeds";
          echo "  3. MCP health succeeds before prompt testing";
          echo;
          echo "Speaches check (local GPU):";
          echo "  curl http://127.0.0.1:8000/v1/models";
          echo;
          echo "Voice worker runs on the ROBOT PC (moretea_robot profile).";
          echo "First MCP tool to call: health";
          echo;
          exec bash'
