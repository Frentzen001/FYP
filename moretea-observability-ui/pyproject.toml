[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moretea-observability-ui"
version = "0.1.0"
description = "Standalone MoreTea observability dashboard and aggregator API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
py-modules = ["backend", "openclaw_pc_reporter", "openclaw_trace_cli"]

[tool.pytest.ini_options]
pythonpath = ["."]
